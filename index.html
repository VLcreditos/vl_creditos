<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>VL Créditos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      background: #111;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 120px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 5px;
    }

    p {
      text-align: center;
      font-size: 14px;
      color: #ccc;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      margin-top: 20px;
      font-size: 16px;
    }

    .box {
      background: #1c1c1c;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .box span {
      display: block;
      margin-top: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #00ff99;
    }

    .btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #00c853;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn:hover {
      background: #00e676;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="VL Créditos">
    </div>

    <h1>VL Créditos</h1>
    <p>Escolha o valor da sua recarga</p>

    <select id="recarga" onchange="calcular()">
      <option value="">Selecione o valor</option>
      <option value="20">R$ 20</option>
      <option value="25">R$ 25</option>
      <option value="30">R$ 30</option>
      <option value="40">R$ 40</option>
      <option value="50">R$ 50</option>
      <option value="100">R$ 100</option>
    </select>

    <div class="box">
      Você recebe:
      <span id="recebe">R$ 0,00</span>
    </div>

    <div class="box">
      Você paga:
      <span id="paga">R$ 0,00</span>
    </div>

    <button class="btn">Finalizar pedido</button>

    <footer>
      © 2026 VL Créditos
    </footer>
  </div>

  <script>
    function calcular() { function finalizarPedido() {
      const valor = document.getElementById("recarga").value;

      if (!valor) {
        alert("Selecione um valor de recarga");
        return;
      }

      let paga = 0;
      if (valor == 20) paga = 16;
      if (valor == 25) paga = 19;
      if (valor == 30) paga = 21;
      if (valor == 40) paga = 24;
      if (valor == 50) paga = 27;
      if (valor == 100) paga = 65;

      const mensagem =
        `Olá! Quero uma recarga de R$ ${valor}, pagando R$ ${paga}.`;

      const numeroWhatsApp = "5571984778390";

      const link =
        `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;

      window.open(link, "_blank");
    }
      const valor = document.getElementById("recarga").value;
      let paga = 0;

      if (valor == 20) paga = 16;
      if (valor == 25) paga = 19;
      if (valor == 30) paga = 21;
      if (valor == 40) paga = 24;
      if (valor == 50) paga = 27;
      if (valor == 100) paga = 65;

      document.getElementById("recebe").innerText =
        valor ? "R$ " + valor + ",00" : "R$ 0,00";

      document.getElementById("paga").innerText =
        paga ? "R$ " + paga + ",00" : "R$ 0,00";
    }
  </script>

</body>
</html>
