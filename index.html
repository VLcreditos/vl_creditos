<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VL Créditos | Recargas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#1a1a1a,#2a2a2a);
  color:#fff;
}
header{
  background:#111;
  padding:25px;
  text-align:center;
}
.logo{
  max-width:140px;
  margin-bottom:10px;
}
.container{
  max-width:420px;
  margin:20px auto;
  background:#1f1f1f;
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
label{
  font-size:14px;
  font-weight:bold;
}
select,input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:6px;
  font-size:15px;
}
.card{margin-top:15px;}
.info{
  margin-top:12px;
  background:#0f1f14;
  border-left:4px solid #25d366;
  padding:10px;
  border-radius:10px;
  font-size:14px;
}
.btn{
  width:100%;
  margin-top:15px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  border:none;
  border-radius:30px;
  background:#25d366;
  color:#000;
  cursor:pointer;
  transition:.3s;
}
.btn:hover{
  transform:scale(1.03);
  box-shadow:0 0 15px #25d366;
}
.btn2{
  background:#fff;
  color:#000;
}
.pixBox{
  margin-top:15px;
  background:#2b2b2b;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  word-break:break-all;
  display:none;
}
.footer{
  text-align:center;
  font-size:12px;
  opacity:.7;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
<img src="logo.png" class="logo">
<h2>VL Créditos</h2>
<p>Recargas • Pagamento via Pix</p>
</header>

<div class="container">

<div class="card">
<label>Operadora</label>
<select id="operadora" onchange="atualizarValores()">
<option value="">Selecione</option>
<option value="Claro">Claro</option>
<option value="TIM">TIM</option>
</select>
</div>

<div class="card">
<label>Valor da recarga</label>
<select id="valor" onchange="mostrarInfo()">
<option value="">Selecione a operadora</option>
</select>
</div>

<div class="card">
<label>Número do celular</label>
<input type="tel" id="numero" placeholder="DDD + número">
</div>

<div class="info" id="info">
Selecione a recarga.
</div>

<div style="margin-top:15px;font-size:14px;">
<label>
<input type="checkbox" id="aceite">
 Li e aceito os Termos e Política
</label>
</div>

<button class="btn" onclick="gerarPix()">
💸 Gerar Pix
</button>

<div class="pixBox" id="pixBox">
<b>Código Pix Copia e Cola:</b><br><br>
<span id="codigoPix"></span><br><br>

<button class="btn btn2" onclick="copiarPix()">📋 Copiar Código</button>

<button class="btn" onclick="enviarWhats()">
📲 Enviar Comprovante no WhatsApp
</button>
</div>

<div class="footer">
⏱️ Recarga em minutos.<br>
Prazo máximo 24h.
</div>

</div>

<script>
const tabela = {
Claro:{20:16,25:19,30:21,40:24,50:27,100:65},
TIM:{15:12,20:16,30:21,40:26,50:29,60:35,100:65}
};

let valorPago=0;

function atualizarValores(){
valor.innerHTML='<option value="">Selecione</option>';
if(!operadora.value) return;

for(let v in tabela[operadora.value]){
valor.innerHTML+=`<option value="${v}">R$ ${v}</option>`;
}
}

function mostrarInfo(){
if(!valor.value) return;
valorPago=tabela[operadora.value][valor.value];
info.innerHTML=`💰 Recebe R$ ${valor.value}<br>💸 Paga R$ ${valorPago}`;
}

function gerarPix(){

if(!aceite.checked){
alert("Aceite os termos.");
return;
}

if(!valorPago){
alert("Selecione a recarga.");
return;
}

const chave="58.306.326/0001-21";
const codigo="00020126580014BR.GOV.BCB.PIX0136"+chave+
"5204000053039865405"+valorPago.toFixed(2)+
"5802BR5925VL CREDITOS6009SAO PAULO62070503***6304ABCD";

codigoPix.innerText=codigo;
pixBox.style.display="block";
}

function copiarPix(){
navigator.clipboard.writeText(codigoPix.innerText);
alert("Código Pix copiado!");
}

function enviarWhats(){

const cod="VL"+Math.floor(Math.random()*90000+10000);

const msg=`Olá, desejo realizar uma recarga.

Pedido: ${cod}
Operadora: ${operadora.value}
Número: ${numero.value}
Recarga: R$ ${valor.value}
Valor pago: R$ ${valorPago}

Pagamento via Pix (comprovante em anexo).
Declaro que li e aceitei os Termos.`;

window.open(
"https://wa.me/5571984778390?text="+encodeURIComponent(msg),
"_blank"
);
}
</script>

</body>
</html>
