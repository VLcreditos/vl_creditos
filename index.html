<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VL Créditos - Recarga com Desconto</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#0a0a0a,#1a1a1a);
  color:#fff;
}
.container{
  max-width:420px;
  margin:30px auto;
  background:#111;
  border-radius:15px;
  padding:20px;
  box-shadow:0 0 20px rgba(0,0,0,.6);
}
.logo{
  text-align:center;
}
.logo img{
  width:120px;
}
h2{
  text-align:center;
  margin:15px 0;
}
label{
  margin-top:15px;
  display:block;
  font-weight:bold;
}
select,input{
  width:100%;
  padding:12px;
  margin-top:5px;
  border-radius:10px;
  border:none;
  font-size:16px;
}
.info{
  background:#1f2933;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  text-align:center;
}
.btn{
  width:100%;
  margin-top:20px;
  padding:15px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:12px;
  background:#25d366;
  color:#000;
  cursor:pointer;
}
.btn:hover{opacity:.9;}
.pix-box{
  background:#000;
  border:2px dashed #25d366;
  padding:15px;
  border-radius:12px;
  text-align:center;
  margin-top:15px;
}
.pix{
  font-size:18px;
  color:#25d366;
  font-weight:bold;
  margin-top:10px;
  word-break:break-all;
}
footer{
  text-align:center;
  font-size:12px;
  color:#aaa;
  margin-top:15px;
}
.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="logo.png">
  </div>

  <h2>Recarga com Desconto</h2>

  <label>Operadora</label>
  <select id="operadora">
    <option value="">Selecione</option>
    <option>Claro</option>
    <option>Vivo</option>
    <option>TIM</option>
  </select>

  <label>Número do celular</label>
  <input type="tel" id="numeroCliente" placeholder="DDD + número">

  <label>Valor da recarga</label>
  <select id="recarga" onchange="mostrarValor()">
    <option value="">Selecione</option>
    <option value="20">R$ 20</option>
    <option value="25">R$ 25</option>
    <option value="30">R$ 30</option>
    <option value="40">R$ 40</option>
    <option value="50">R$ 50</option>
    <option value="100">R$ 100</option>
  </select>

  <div class="info" id="info">
    Escolha a recarga para ver o valor
  </div>

  <button class="btn" onclick="irParaPix()">Continuar para pagamento</button>

  <div id="pixTela" class="hidden">

    <div class="pix-box">
      <h3>Pagamento via PIX</h3>
      <p>Faça o pagamento para o CNPJ:</p>
      <div class="pix">58.306.326/0001-21</div>
      <p>Após pagar, envie o comprovante pelo WhatsApp</p>
    </div>

    <button class="btn" onclick="enviarWhats()">Enviar comprovante no WhatsApp</button>

  </div>

  <footer>
    ⚡ Recarga rápida • Atendimento direto no WhatsApp
  </footer>

</div>

<script>
let valorPaga = 0;

function mostrarValor(){
  const v = document.getElementById("recarga").value;
  if(v==20) valorPaga=16;
  if(v==25) valorPaga=19;
  if(v==30) valorPaga=21;
  if(v==40) valorPaga=24;
  if(v==50) valorPaga=27;
  if(v==100) valorPaga=65;

  if(v){
    document.getElementById("info").innerHTML =
    `Você recebe <b>R$ ${v}</b><br>Você paga <b>R$ ${valorPaga}</b>`;
  }
}

function irParaPix(){
  const op=document.getElementById("operadora").value;
  const num=document.getElementById("numeroCliente").value;
  const v=document.getElementById("recarga").value;

  if(!op || !num || !v){
    alert("Preencha todos os campos");
    return;
  }

  document.getElementById("pixTela").classList.remove("hidden");
}

function enviarWhats(){
  const op=document.getElementById("operadora").value;
  const num=document.getElementById("numeroCliente").value;
  const v=document.getElementById("recarga").value;

  const msg =
`📲 *COMPROVANTE DE RECARGA*
Operadora: ${op}
Número: ${num}
Recarga: R$ ${v}
Valor pago: R$ ${valorPaga}
PIX: 58.306.326/0001-21`;

  const wa="5571984778390";
  window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`,"_blank");
}
</script>

</body>
    </html>
