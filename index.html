<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VL Créditos | Recargas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#1a1a1a,#2a2a2a);
  color:#fff;
}
header{
  background:#111;
  padding:20px;
  text-align:center;
}
header img{
  max-width:160px;
}
.container{
  max-width:420px;
  margin:20px auto;
  background:#1f1f1f;
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
h1{text-align:center;font-size:22px;}
label{font-size:14px;font-weight:bold;}
select,input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:6px;
  font-size:15px;
}
.card{margin-top:15px;}
.info{
  margin-top:12px;
  background:#0f1f14;
  border-left:4px solid #25d366;
  padding:10px;
  border-radius:10px;
  font-size:14px;
}
.btn{
  width:100%;
  margin-top:18px;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  border:none;
  border-radius:30px;
  background:#25d366;
  color:#000;
  cursor:pointer;
  transition:.2s;
}
.btn:hover{
  transform:scale(1.05);
}
.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.pix-area{
  margin-top:20px;
  background:#111;
  padding:15px;
  border-radius:12px;
  display:none;
}
textarea{
  width:100%;
  border-radius:10px;
  border:none;
  padding:10px;
  font-size:12px;
}
.footer{
  text-align:center;
  font-size:12px;
  opacity:.7;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="VL Créditos">
  <h1>VL Créditos</h1>
  <p>Recargas com desconto</p>
</header>

<div class="container">

<form onsubmit="gerarPix(event)">

<div class="card">
<label>Operadora</label>
<select id="operadora" required onchange="atualizarValores()">
<option value="">Selecione</option>
<option value="Claro">Claro</option>
<option value="TIM">TIM</option>
</select>
</div>

<div class="card">
<label>Valor da recarga</label>
<select id="valor" required onchange="mostrarInfo()">
<option value="">Selecione a operadora</option>
</select>
</div>

<div class="card">
<label>Número</label>
<input type="tel" id="numero" required>
</div>

<div class="info" id="info">
Selecione a recarga.
</div>

<div style="margin-top:15px;">
<label>
<input type="checkbox" id="aceite" onclick="liberar()">
 Li e aceito os Termos
</label>
</div>

<button class="btn" id="btnPagar" disabled>
💸 Gerar Pix Copia e Cola
</button>

</form>

<div class="pix-area" id="pixArea">

<h3>🔑 Pix Copia e Cola</h3>

<textarea id="codigoPix" rows="5" readonly></textarea>

<button class="btn" onclick="copiarPix()">📋 Copiar Código Pix</button>

<button class="btn" onclick="enviarWhats()">📲 Enviar Comprovante</button>

</div>

<div class="footer">
© 2026 VL Créditos
</div>

</div>

<script>

const chavePix = "58306326000121"; // CNPJ sem pontuação

const tabela = {
  Claro: {20:16,25:19,30:21,40:24,50:27,100:65},
  TIM: {15:12,20:16,30:21,40:26,50:29,60:35,100:65}
};

let valorPago = 0;

function atualizarValores(){
  const op = operadora.value;
  valor.innerHTML = '<option value="">Selecione</option>';
  if(!op) return;

  for(let v in tabela[op]){
    valor.innerHTML += `<option value="${v}">R$ ${v}</option>`;
  }
}

function mostrarInfo(){
  const v = valor.value;
  if(!v) return;

  valorPago = tabela[operadora.value][v];
  info.innerHTML = `
  💰 Você recebe R$ ${v}<br>
  💸 Você paga R$ ${valorPago}
  `;
}

function liberar(){
  btnPagar.disabled = !aceite.checked;
}

function gerarPix(e){
  e.preventDefault();

  const valorFormatado = valorPago.toFixed(2);

  let payload =
    "000201" +
    "26580014BR.GOV.BCB.PIX01" +
    chavePix.length.toString().padStart(2,'0') +
    chavePix +
    "52040000" +
    "5303986" +
    "54" + valorFormatado.length.toString().padStart(2,'0') + valorFormatado +
    "5802BR" +
    "5909VL CREDIT" +
    "6008SALVADOR" +
    "62070503***" +
    "6304";

  payload += crc16(payload);

  codigoPix.value = payload;
  pixArea.style.display = "block";
}

function crc16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      if ((crc & 0x8000) !== 0) {
        crc = (crc << 1) ^ 0x1021;
      } else {
        crc <<= 1;
      }
    }
  }
  crc &= 0xFFFF;
  return crc.toString(16).toUpperCase().padStart(4,'0');
}

function copiarPix(){
  codigoPix.select();
  document.execCommand("copy");
  alert("Código Pix copiado!");
}

function enviarWhats(){
  const msg=`Olá, desejo realizar uma recarga.

Operadora: ${operadora.value}
Número: ${numero.value}
Recarga: R$ ${valor.value}
Valor pago: R$ ${valorPago}

Pagamento via Pix (comprovante em anexo).
Declaro que li e aceitei os Termos.`;

  window.open(
  "https://wa.me/5571984778390?text="+encodeURIComponent(msg),
  "_blank"
  );
}

</script>

</body>
                        </html>
