<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recargas com Desconto</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1220;
  --card:#111827;
  --input:#020617;
  --border:#1f2937;
  --primary:#2563eb;
  --secondary:#22c55e;
  --text:#e5e7eb;
  --muted:#9ca3af;
}

*{
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
  padding:20px 12px;
}

/* APP */
.app{
  background:var(--card);
  max-width:420px;
  width:100%;
  border-radius:22px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.7);
  animation:fade .5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:20px;
}

.header img{
  max-width:120px;
  margin-bottom:10px;
}

.header h1{
  font-size:20px;
  margin:0;
  color:var(--text);
}

/* FORM */
label{
  display:block;
  margin:14px 0 6px;
  font-size:13px;
  font-weight:600;
  color:var(--muted);
}

select,input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  font-size:15px;
}

select:focus,input:focus{
  outline:none;
  border-color:var(--primary);
}

/* INFO */
.info{
  margin:16px 0;
  padding:14px;
  border-radius:14px;
  background:#020617;
  border:1px solid var(--border);
  font-size:13px;
  color:var(--text);
}

/* PIX */
.pix{
  margin-bottom:18px;
  padding:14px;
  border-radius:14px;
  background:rgba(34,197,94,.08);
  border:1px dashed var(--secondary);
  font-size:14px;
  color:var(--text);
}

.pix strong{
  color:var(--secondary);
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-1px);
  opacity:.95;
}

/* FOOTER */
.footer{
  text-align:center;
  margin-top:16px;
  font-size:11px;
  color:#6b7280;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <img src="logo.png" alt="Logo">
    <h1>Recargas com Desconto</h1>
  </div>

  <label>Operadora</label>
  <select id="operadora">
    <option value="">Selecione</option>
    <option value="CLARO">CLARO</option>
    <option value="TIM">TIM</option>
  </select>

  <label>Valor da Recarga</label>
  <select id="valor">
    <option value="">Escolha o valor</option>
  </select>

  <label>Número para recarga</label>
  <input type="tel" id="numero" placeholder="DDD + número">

  <div class="info">
    ⏱ Prazo de recarga: até <strong>24 horas</strong><br>
    💰 Caso não seja efetuada, o valor será <strong>devolvido</strong>.
  </div>

  <div class="pix">
    Pagamento via <strong>PIX</strong><br>
    Chave (CNPJ):<br>
    <strong>58.306.326/0001-21</strong><br><br>
    Envie o comprovante pelo WhatsApp
  </div>

  <button onclick="finalizar()">Ir para o WhatsApp</button>

  <div class="footer">
    © 2026 • Sistema Seguro de Recargas
  </div>

</div>

<script>
const valores={
  CLARO:[
    {r:20,p:16},{r:25,p:19},{r:30,p:21},
    {r:40,p:24},{r:50,p:27},{r:100,p:65}
  ],
  TIM:[
    {r:15,p:12},{r:20,p:16},{r:30,p:21},
    {r:40,p:26},{r:50,p:29},{r:60,p:35},{r:100,p:65}
  ]
};

operadora.onchange=()=>{
  valor.innerHTML='<option value="">Escolha o valor</option>';
  valores[operadora.value]?.forEach(v=>{
    valor.innerHTML+=`
      <option value="Recebe R$ ${v.r} | Paga R$ ${v.p}">
        Recebe R$ ${v.r} | Paga R$ ${v.p}
      </option>`;
  });
};

function finalizar(){
  if(!operadora.value || !valor.value || !numero.value){
    alert("Preencha todos os campos");
    return;
  }

  const msg=`📲 Operadora: ${operadora.value}
📞 Número: ${numero.value}
💰 ${valor.value}

Pagamento via PIX
Envio de comprovante`;

  window.open(
    `https://wa.me/5571984778390?text=${encodeURIComponent(msg)}`,
    "_blank"
  );
}
</script>

</body>
</html>
