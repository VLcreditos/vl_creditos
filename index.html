<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>VL Créditos - Recargas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      margin: 0;
      padding: 0;
      color: #fff;
    }

    .container {
      max-width: 400px;
      margin: 30px auto;
      background: #111;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    .logo {
      text-align: center;
      margin-bottom: 15px;
    }

    .logo img {
      width: 120px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .info {
      margin-top: 15px;
      background: #1f2933;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    .btn {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      background: #25d366;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: #000;
    }

    .btn:hover {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="VL Créditos">
    </div>

    <h2>Recarga de Celular</h2>

    <label>Operadora</label>
    <select id="operadora">
      <option value="">Selecione</option>
      <option>Claro</option>
      <option>Vivo</option>
      <option>TIM</option>
    </select>

    <label>Número do celular</label>
    <input type="tel" id="numeroCliente" placeholder="DDD + número">

    <label>Valor da recarga</label>
    <select id="recarga" onchange="calcular()">
      <option value="">Selecione</option>
      <option value="20">R$ 20</option>
      <option value="25">R$ 25</option>
      <option value="30">R$ 30</option>
      <option value="40">R$ 40</option>
      <option value="50">R$ 50</option>
      <option value="100">R$ 100</option>
    </select>

    <div class="info" id="resultado">
      Escolha uma recarga para ver o valor
    </div>

    <button class="btn" onclick="finalizarPedido()">Finalizar no WhatsApp</button>

    <footer>
      Pagamento via Pix • Atendimento rápido
    </footer>
  </div>

  <script>
    function calcular() {
      const valor = document.getElementById("recarga").value;
      let paga = 0;

      if (valor == 20) paga = 16;
      if (valor == 25) paga = 19;
      if (valor == 30) paga = 21;
      if (valor == 40) paga = 24;
      if (valor == 50) paga = 27;
      if (valor == 100) paga = 65;

      if (valor) {
        document.getElementById("resultado").innerHTML =
          `Você recebe <b>R$ ${valor}</b><br>Você paga <b>R$ ${paga}</b>`;
      }
    }

    function finalizarPedido() {
      const operadora = document.getElementById("operadora").value;
      const numeroCliente = document.getElementById("numeroCliente").value;
      const valor = document.getElementById("recarga").value;

      if (!operadora || !numeroCliente || !valor) {
        alert("Preencha todos os campos");
        return;
      }

      let paga = 0;
      if (valor == 20) paga = 16;
      if (valor == 25) paga = 19;
      if (valor == 30) paga = 21;
      if (valor == 40) paga = 24;
      if (valor == 50) paga = 27;
      if (valor == 100) paga = 65;

      const mensagem =
`📲 *Pedido de Recarga*
Operadora: ${operadora}
Número: ${numeroCliente}
Recarga: R$ ${valor}
Valor pago: R$ ${paga}`;

      const numeroWhatsApp = "5571984778390";

      const link = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;

      window.open(link, "_blank");
    }
  </script>

</body>
</html>
