<style>
body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:linear-gradient(180deg,#111827,#1f2937);
  color:#f9fafb;
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:20px auto;
  background:#1f2937;
  border-radius:22px;
  padding:22px;
  box-shadow:0 20px 45px rgba(0,0,0,.45);
}

/* LOGO */
.logo{
  display:block;
  margin:5px auto 12px;
  max-width:140px;
}

/* TITULOS */
h1{
  text-align:center;
  font-size:22px;
  margin:10px 0 5px;
  font-weight:700;
}
.sub{
  text-align:center;
  font-size:14px;
  color:#d1d5db;
}

/* CARD */
.card{
  background:#374151;
  border-radius:18px;
  padding:16px;
  margin-top:20px;
}

/* LABELS */
label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-top:14px;
  color:#e5e7eb;
}

/* INPUTS */
select,input{
  width:100%;
  padding:14px;
  margin-top:6px;
  border-radius:14px;
  border:1px solid #4b5563;
  font-size:15px;
  background:#111827;
  color:#f9fafb;
}

select:focus,input:focus{
  outline:none;
  border-color:#2563eb;
}

/* INFO */
.info{
  margin-top:16px;
  background:#1f2937;
  border-left:4px solid #22c55e;
  padding:12px;
  border-radius:12px;
  text-align:center;
  font-size:14px;
}
.info b{color:#22c55e;}

/* BOTÃO */
.btn{
  width:100%;
  margin-top:18px;
  padding:16px;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;
  cursor:pointer;
  transition:.3s;
}
.btn:hover{
  transform:translateY(-1px);
  opacity:.95;
}

/* AVISO */
.aviso{
  margin-top:14px;
  background:#fef3c7;
  color:#111827;
  border-radius:14px;
  padding:12px;
  font-size:13px;
  text-align:center;
}

/* PIX */
.pix-box{
  margin-top:20px;
  background:#1f2937;
  border:2px dashed #22c55e;
  border-radius:18px;
  padding:16px;
  text-align:center;
}
.pix{
  font-size:17px;
  font-weight:700;
  color:#22c55e;
  margin:10px 0;
  word-break:break-all;
}

.hidden{display:none;}

/* FOOTER */
.footer{
  text-align:center;
  font-size:11px;
  color:#d1d5db;
  margin-top:18px;
}
  </style>
