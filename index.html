<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VL Créditos | Recargas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#1a1a1a,#2a2a2a);
  color:#fff;
}
header{
  background:#111;
  padding:20px;
  text-align:center;
}
header img{max-width:160px;}
.container{
  max-width:420px;
  margin:20px auto;
  background:#1f1f1f;
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
h1{text-align:center;font-size:22px;}
label{font-size:14px;font-weight:bold;}
select,input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:6px;
  font-size:15px;
}
.card{margin-top:15px;}
.info{
  margin-top:12px;
  background:#0f1f14;
  border-left:4px solid #25d366;
  padding:10px;
  border-radius:10px;
  font-size:14px;
}
.btn{
  width:100%;
  margin-top:18px;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  border:none;
  border-radius:30px;
  background:#25d366;
  color:#000;
}
.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.aviso{
  margin-top:12px;
  background:#2b2b2b;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  text-align:center;
}
.footer{
  text-align:center;
  font-size:12px;
  opacity:.7;
  margin-top:20px;
}
a{color:#25d366;text-decoration:none;}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="VL Créditos">
  <h1>VL Créditos</h1>
  <p>Recargas • Atendimento via WhatsApp</p>
</header>

<div class="container">

<form onsubmit="enviarWhats(event)">

<div class="card">
<label>Operadora</label>
<select id="operadora" required>
<option value="">Selecione</option>
<option value="Claro">Claro</option>
<option value="TIM">TIM</option>
</select>
</div>

<div class="card">
<label>Valor da recarga</label>
<select id="valor" required>
<option value="">Selecione</option>
<option>R$ 20</option>
<option>R$ 30</option>
<option>R$ 40</option>
<option>R$ 50</option>
<option>R$ 100</option>
</select>
</div>

<div class="card">
<label>Número do celular</label>
<input type="tel" id="numero" placeholder="DDD + número" required>
</div>

<div class="info">
⏱️ A recarga normalmente ocorre em minutos.<br>
O prazo máximo informado é de até <b>24 horas</b> por segurança operacional.
</div>

<!-- ACEITE OBRIGATÓRIO -->
<div style="margin-top:15px;font-size:14px;">
<label style="cursor:pointer;">
<input type="checkbox" id="aceite" onclick="liberarPagamento()">
 Li e aceito os
 <a href="politica.html" target="_blank"><b>Termos e Política</b></a>
</label>
</div>

<button class="btn" id="btnPagar" type="submit" disabled>
💸 Prosseguir para pagamento
</button>

<div class="aviso">
Caso a recarga não seja concluída dentro do prazo,
o valor pago será <b>devolvido</b>.
</div>

</form>

<div class="footer">
© 2026 VL Créditos • Serviço intermediado
</div>

</div>

<script>
function liberarPagamento(){
  const check=document.getElementById("aceite");
  const btn=document.getElementById("btnPagar");
  btn.disabled=!check.checked;
}

function enviarWhats(e){
  e.preventDefault();

  const op=document.getElementById("operadora").value;
  const val=document.getElementById("valor").value;
  const num=document.getElementById("numero").value;
  const cod="VL"+Math.floor(Math.random()*90000+10000);

  const msg=`Olá, desejo realizar uma recarga.

Pedido: ${cod}
Operadora: ${op}
Valor: ${val}
Número: ${num}

Declaro que li e aceitei os Termos.
Pagamento via Pix (comprovante em anexo).`;

  window.open("https://wa.me/5571984778390?text="+encodeURIComponent(msg),"_blank");
}
</script>

</body>
   </html>
