<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VL Créditos | Recargas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#1a1a1a,#2a2a2a);
  color:#fff;
}
header{
  background:#111;
  padding:20px;
  text-align:center;
}
header img{max-width:160px;}
.container{
  max-width:420px;
  margin:20px auto;
  background:#1f1f1f;
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
h1{text-align:center;font-size:22px;}
label{font-size:14px;font-weight:bold;}
select,input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:6px;
  font-size:15px;
}
.card{margin-top:15px;}
.info{
  margin-top:12px;
  background:#0f1f14;
  border-left:4px solid #25d366;
  padding:12px;
  border-radius:10px;
  font-size:14px;
}
.btn{
  width:100%;
  margin-top:18px;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  border:none;
  border-radius:30px;
  background:#25d366;
  color:#000;
  cursor:pointer;
  transition:.3s;
}
.btn:hover{
  transform:scale(1.03);
  box-shadow:0 0 15px #25d366;
}
.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.pixBox{
  margin-top:20px;
  background:#111;
  padding:15px;
  border-radius:15px;
  font-size:13px;
  word-break:break-all;
}
.timer{
  margin-top:10px;
  font-size:14px;
  color:#ffcc00;
  text-align:center;
}
.footer{
  text-align:center;
  font-size:12px;
  opacity:.7;
  margin-top:20px;
}
a{color:#25d366;text-decoration:none;}
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <h1>VL Créditos</h1>
  <p>Recargas • Atendimento via WhatsApp</p>
</header>

<div class="container">

<form onsubmit="gerarPix(event)">

<div class="card">
<label>Operadora</label>
<select id="operadora" required onchange="atualizarValores()">
<option value="">Selecione</option>
<option value="Claro">Claro</option>
<option value="TIM">TIM</option>
</select>
</div>

<div class="card">
<label>Valor da recarga</label>
<select id="valor" required onchange="mostrarInfo()">
<option value="">Selecione a operadora</option>
</select>
</div>

<div class="card">
<label>Número do celular</label>
<input type="tel" id="numero" placeholder="DDD + número" required>
</div>

<div class="info" id="info">
Selecione a recarga para ver os valores.
</div>

<div style="margin-top:15px;font-size:14px;">
<label style="cursor:pointer;">
<input type="checkbox" id="aceite" onclick="liberarPagamento()">
 Li e aceito os <a href="politica.html" target="_blank"><b>Termos e Política</b></a>
</label>
</div>

<button class="btn" id="btnPagar" disabled>
💸 Prosseguir para pagamento
</button>

</form>

<div id="areaPix"></div>

<div class="footer">
© 2026 VL Créditos • Serviço intermediado
</div>

</div>

<script>

const tabela = {
  Claro: {20:16,25:19,30:21,40:24,50:27,100:65},
  TIM: {15:12,20:16,30:21,40:26,50:29,60:35,100:65}
};

let valorPago = 0;

function atualizarValores(){
  valor.innerHTML='<option value="">Selecione</option>';
  info.innerHTML='Selecione a recarga para ver os valores.';
  if(!operadora.value) return;
  for(let v in tabela[operadora.value]){
    valor.innerHTML+=`<option value="${v}">R$ ${v}</option>`;
  }
}

function mostrarInfo(){
  const v=valor.value;
  if(!v) return;
  valorPago=tabela[operadora.value][v];
  info.innerHTML=`💰 Você recebe <b>R$ ${v}</b><br>💸 Você paga <b>R$ ${valorPago}</b>`;
}

function liberarPagamento(){
  btnPagar.disabled=!aceite.checked;
}

function montarCampo(id,valor){
  return id+valor.length.toString().padStart(2,'0')+valor;
}

function gerarPix(e){
e.preventDefault();

const valorFormatado=Number(valorPago).toFixed(2);
const txid="VL"+Math.floor(Math.random()*99999);

let payload="";
payload+=montarCampo("00","01");

let merchant="";
merchant+=montarCampo("00","BR.GOV.BCB.PIX");
merchant+=montarCampo("01","58306326000121");
payload+=montarCampo("26",merchant);

payload+=montarCampo("52","0000");
payload+=montarCampo("53","986");
payload+=montarCampo("54",valorFormatado);
payload+=montarCampo("58","BR");
payload+=montarCampo("59","VL CREDITOS");
payload+=montarCampo("60","SALVADOR");

let adicional=montarCampo("05",txid);
payload+=montarCampo("62",adicional);

payload+="6304";
payload+=crc16(payload);

areaPix.innerHTML=`
<div class="pixBox">
<b>🔑 Pix Copia e Cola:</b><br><br>
${payload}<br><br>
<button class="btn" onclick="copiarPix('${payload}')">📋 Copiar Código</button>
<button class="btn" onclick="irWhats()">📲 Enviar Comprovante</button>
<div class="timer" id="timer">⏳ Tempo restante: 10:00</div>
</div>
`;

iniciarContador(600);
}

function crc16(str){
let crc=0xFFFF;
for(let c=0;c<str.length;c++){
crc^=str.charCodeAt(c)<<8;
for(let i=0;i<8;i++){
if(crc&0x8000){crc=(crc<<1)^0x1021;}
else{crc<<=1;}
}
}
crc&=0xFFFF;
return crc.toString(16).toUpperCase().padStart(4,'0');
}

function copiarPix(codigo){
navigator.clipboard.writeText(codigo);
alert("Código Pix copiado!");
}

function irWhats(){
const msg=`Olá, já realizei o pagamento via Pix.
Número: ${numero.value}
Recarga: R$ ${valor.value}
Valor pago: R$ ${valorPago}`;
window.open("https://wa.me/5571984778390?text="+encodeURIComponent(msg),"_blank");
}

function iniciarContador(segundos){
let tempo=segundos;
const el=document.getElementById("timer");
const intervalo=setInterval(()=>{
let min=Math.floor(tempo/60);
let seg=tempo%60;
el.innerHTML=`⏳ Tempo restante: ${min}:${seg.toString().padStart(2,'0')}`;
tempo--;
if(tempo<0){
clearInterval(intervalo);
el.innerHTML="❌ Tempo expirado. Gere um novo código.";
}
},1000);
}

</script>

</body>
</html>
