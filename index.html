<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VL Créditos - Recarga com Desconto</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#0b0000,#1a0000);
  color:#fff;
}
.container{
  max-width:420px;
  margin:25px auto;
  background:#120000;
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 25px rgba(0,0,0,.6);
}
.logo{
  display:block;
  margin:10px auto;
  max-width:160px;
}
h2{text-align:center;}
label{
  margin-top:12px;
  display:block;
  font-weight:bold;
}
select,input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:none;
  font-size:16px;
}
.info{
  background:#1f2933;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  text-align:center;
}
.btn{
  width:100%;
  margin-top:20px;
  padding:15px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:14px;
  background:#25d366;
  color:#000;
}
.aviso{
  margin-top:12px;
  background:#ffeb3b;
  color:#000;
  font-weight:bold;
  text-align:center;
  padding:10px;
  border-radius:10px;
  font-size:14px;
}
.pix-box{
  background:#000;
  border:2px dashed #25d366;
  padding:15px;
  border-radius:14px;
  text-align:center;
  margin-top:20px;
}
.pix{
  font-size:18px;
  color:#25d366;
  font-weight:bold;
  margin-top:10px;
}
.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <img src="logo.png" alt="VL Créditos" class="logo">

  <h2>📲 Recarga com Desconto</h2>

  <label>Operadora</label>
  <select id="operadora">
    <option value="">Selecione</option>
    <option>Claro</option>
    <option>TIM</option>
  </select>

  <label>Número do celular</label>
  <input type="tel" id="numero" placeholder="DDD + número">

  <label>Valor da recarga</label>
  <select id="valor" onchange="mostrarValor()">
    <option value="">Selecione</option>

    <!-- CLARO / TIM -->
    <option value="20">R$ 20</option>
    <option value="25">R$ 25</option>
    <option value="30">R$ 30</option>
    <option value="40">R$ 40</option>
    <option value="50">R$ 50</option>
    <option value="60">R$ 60</option>
    <option value="100">R$ 100</option>
  </select>

  <div class="info" id="info">Escolha a recarga</div>

  <button class="btn" onclick="irPix()">Continuar para pagamento</button>

  <div class="aviso">
    ⏱️ Recarga em até <b>24 horas</b><br>
    🔒 Caso não seja feita, o valor será <b>devolvido</b>
  </div>

  <div id="pix" class="hidden">
    <div class="pix-box">
      <h3>Pagamento via PIX</h3>
      <p>Chave PIX (CNPJ)</p>
      <div class="pix">58.306.326/0001-21</div>
      <p>Envie o comprovante no WhatsApp</p>
    </div>

    <button class="btn" onclick="enviarWhats()">Enviar comprovante</button>
  </div>

</div>

<script>
let paga = 0;

function mostrarValor(){
  const v = document.getElementById("valor").value;

  if(v==20) paga=16;
  if(v==25) paga=19;
  if(v==30) paga=21;
  if(v==40) paga=24;
  if(v==50) paga=27;
  if(v==60) paga=35;
  if(v==100) paga=65;

  if(v){
    document.getElementById("info").innerHTML =
      `Você recebe <b>R$ ${v}</b><br>Você paga <b>R$ ${paga}</b>`;
  }
}

function irPix(){
  if(!operadora.value || !numero.value || !valor.value){
    alert("Preencha todos os campos");
    return;
  }
  pix.classList.remove("hidden");
}

function enviarWhats(){
  const msg =
`📲 PEDIDO DE RECARGA
Operadora: ${operadora.value}
Número: ${numero.value}
Recarga: R$ ${valor.value}
Valor pago: R$ ${paga}
PIX: 58.306.326/0001-21`;

  window.open(
    "https://wa.me/5571984778390?text="+encodeURIComponent(msg),
    "_blank"
  );
}
</script>

</body>
</html>
