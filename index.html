<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VL Créditos | Recargas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#1a1a1a,#2a2a2a);
  color:#fff;
}
header{
  background:#111;
  padding:20px;
  text-align:center;
}
header img{max-width:160px;}
.container{
  max-width:420px;
  margin:20px auto;
  background:#1f1f1f;
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
h1{text-align:center;font-size:22px;}
label{font-size:14px;font-weight:bold;}
select,input,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:6px;
  font-size:15px;
}
.card{margin-top:15px;}
.info{
  margin-top:12px;
  background:#0f1f14;
  border-left:4px solid #25d366;
  padding:10px;
  border-radius:10px;
  font-size:14px;
}
.btn{
  width:100%;
  margin-top:18px;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  border:none;
  border-radius:30px;
  background:#25d366;
  color:#000;
  cursor:pointer;
  transition:.3s;
}
.btn:hover{
  transform:scale(1.03);
  box-shadow:0 0 20px #25d366;
}
.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.pix-area{
  display:none;
  margin-top:20px;
  background:#111;
  padding:15px;
  border-radius:15px;
}
.timer{
  text-align:center;
  font-size:18px;
  color:#25d366;
  margin-top:10px;
}
.footer{
  text-align:center;
  font-size:12px;
  opacity:.7;
  margin-top:20px;
}
a{color:#25d366;text-decoration:none;}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="VL Créditos">
  <h1>VL Créditos</h1>
  <p>Recargas com desconto • Atendimento via WhatsApp</p>
</header>

<div class="container">

<form onsubmit="gerarPix(event)">

<div class="card">
<label>Operadora</label>
<select id="operadora" required onchange="atualizarValores()">
<option value="">Selecione</option>
<option value="Claro">Claro</option>
<option value="TIM">TIM</option>
</select>
</div>

<div class="card">
<label>Valor da recarga</label>
<select id="valor" required onchange="mostrarInfo()">
<option value="">Selecione a operadora</option>
</select>
</div>

<div class="card">
<label>Número do celular</label>
<input type="tel" id="numero" placeholder="DDD + número" required>
</div>

<div class="info" id="info">
Selecione a recarga para ver os valores.
</div>

<div style="margin-top:15px;">
<label>
<input type="checkbox" id="aceite" onclick="liberar()">
 Li e aceito os <a href="politica.html" target="_blank"><b>Termos e Política</b></a>
</label>
</div>

<button class="btn" id="btnPagar" disabled>
💸 Gerar Pix para pagamento
</button>

</form>

<div class="pix-area" id="pixArea">

<h3>💳 Pix Copia e Cola</h3>

<p><b>Pedido:</b> <span id="pedidoCodigo"></span></p>

<textarea id="codigoPix" rows="4" readonly></textarea>

<button class="btn" onclick="copiarPix()">📋 Copiar código Pix</button>

<div class="timer" id="contador"></div>

<button class="btn" onclick="enviarWhats()">📲 Enviar comprovante no WhatsApp</button>

</div>

<div class="footer">
© 2026 VL Créditos • Serviço intermediado
</div>

</div>

<script>

const chavePix = "58306326000121";
const nomeRecebedor = "VL CREDITOS";
const cidade = "SALVADOR";

const tabela = {
  Claro: {20:16,25:19,30:21,40:24,50:27,100:65},
  TIM: {15:12,20:16,30:21,40:26,50:29,60:35,100:65}
};

let valorPago = 0;
let numeroPedido = "";

function atualizarValores(){
  valor.innerHTML = '<option value="">Selecione</option>';
  info.innerHTML = "Selecione a recarga para ver os valores.";
  if(!operadora.value) return;

  for(let v in tabela[operadora.value]){
    valor.innerHTML += `<option value="${v}">R$ ${v}</option>`;
  }
}

function mostrarInfo(){
  if(!valor.value) return;
  valorPago = tabela[operadora.value][valor.value];
  info.innerHTML = `
  💰 Você recebe R$ ${valor.value}<br>
  💸 Você paga R$ ${valorPago}
  `;
}

function liberar(){
  btnPagar.disabled = !aceite.checked;
}

function gerarPix(e){
  e.preventDefault();

  numeroPedido = "VL" + Math.floor(Math.random()*90000+10000);
  pedidoCodigo.innerText = numeroPedido;

  const valorFormatado = valorPago.toFixed(2);

  let payload = "000201";
  let gui = "0014BR.GOV.BCB.PIX";
  let chave = "01" + chavePix.length.toString().padStart(2,'0') + chavePix;
  let merchant = gui + chave;

  payload += "26" + merchant.length.toString().padStart(2,'0') + merchant;
  payload += "52040000";
  payload += "5303986";
  payload += "54" + valorFormatado.length.toString().padStart(2,'0') + valorFormatado;
  payload += "5802BR";
  payload += "59" + nomeRecebedor.length.toString().padStart(2,'0') + nomeRecebedor;
  payload += "60" + cidade.length.toString().padStart(2,'0') + cidade;
  payload += "62070503***";
  payload += "6304";
  payload += crc16(payload);

  codigoPix.value = payload;
  pixArea.style.display = "block";
  iniciarContador();
}

function crc16(str){
  let crc = 0xFFFF;
  for (let c = 0; c < str.length; c++) {
    crc ^= str.charCodeAt(c) << 8;
    for (let i = 0; i < 8; i++) {
      crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
    }
  }
  crc &= 0xFFFF;
  return crc.toString(16).toUpperCase().padStart(4,'0');
}

function copiarPix(){
  codigoPix.select();
  document.execCommand("copy");
  alert("Código Pix copiado!");
}

function iniciarContador(){
  let tempo = 300;
  const el = document.getElementById("contador");
  const intervalo = setInterval(()=>{
    let min = Math.floor(tempo/60);
    let seg = tempo%60;
    el.innerHTML = "⏳ Expira em: " + min + ":" + (seg<10?"0":"") + seg;
    tempo--;
    if(tempo < 0){
      clearInterval(intervalo);
      el.innerHTML = "⚠️ Código expirado. Gere novamente.";
    }
  },1000);
}

function enviarWhats(){
  const msg=`Olá, desejo realizar uma recarga.

Pedido: ${numeroPedido}
Operadora: ${operadora.value}
Número: ${numero.value}
Recarga: R$ ${valor.value}
Valor pago: R$ ${valorPago}

Pagamento via Pix (comprovante em anexo).
Declaro que li e aceitei os Termos.`;

  window.open(
    "https://wa.me/5571984778390?text="+encodeURIComponent(msg),
    "_blank"
  );
}

</script>

</body>
</html>
